<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // --- 1. 原始資料保持不變 ---
        const rawData = `
作者名稱
1fjHIQfW5cc94wZzQAt-F6w79rxyC6L6i
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
這是第一張圖的第一行文字
這是副標題
1AuObtJoxF1jamKcPB2iEItdaTpHcxbHy
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
這張圖只有第一行，所以它可以顯示兩排文字喔！這張圖只有第一行，所以它可以顯示兩排文字喔！

...
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
第三張圖的標題
第三張的描述第三張的描述第三張的描述第三張的描述
...
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
`;
    </script>

    <style>
:root {
                --ratio: 16 / 9; 
            --progress-color: #d4d4d49f; /* 進度條顏色 (白色) */
            --progress-bg: rgba(255, 255, 255, 0); /* 進度條底色 (半透明) */
    --text-color-main: rgb(33, 33, 33); /* 主標題顏色與透明度 */
    --text-color-sub: rgb(33, 33, 33);  /* 副標題顏色與透明度 */
    --font-size-main: 12px;
    --font-size-sub: 12px;
}

        body { margin: 0; font-family: sans-serif; background: transparent; overflow-x: hidden; }

        /* 輪播圖外框 (方框) */
        .carousel-container {
            width: 100%;
            max-width: 300px;
            margin: auto;
            position: relative;
            overflow: hidden;
            padding-bottom: 3px;
        /*  border-radius: 12px; /* 圓角 */
        /*  box-shadow: 0 8px 20px rgba(0,0,0,0.3); /* 陰影效果 */
            aspect-ratio: var(--ratio);
        }

        .main-wrapper {
            position: relative;
            max-width: 800px;
            margin: auto; /* 居中 */
            padding-top: 0px;
            padding-left: 80px;
            /* 重要：這裡不要寫 overflow: hidden */
        }
        
        /* 大頭貼 */
        .avatar {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            z-index: 100;
            object-fit: cover;
        }

        /* 圖片軌道 */
        .carousel-track {
            display: flex;
        /*  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* 平滑移動 */
            height: 100%;
        }

        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* 確保超連結標籤在軌道上佔滿寬度 */
.slide-link {
    width: 100%;
    height: 100%;
    flex-shrink: 0;
    display: block; /* 讓 <a> 撐開 */
}
/* 讓圖片填滿超連結標籤 */
.slide-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

        /* 左右按鈕 */
        .nav-btn {
            position: absolute;
            top: 0;
            bottom: 3px;
            width: 23px; /* 觸發寬度 */
            background: rgba(0, 0, 0, 0);
            color: rgba(255, 255, 255, 0);
            border: none; /* 邊框 */
            cursor: pointer; /* 游標小手 */
            font-size: 24px;
            z-index: 15;
        /*  transition: background 0.5s; /* 漸移 */
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none; /* 外框 */
            background-repeat: no-repeat;
        }

        .prev { left: 0; }
        .next { right: 0; }

        /* 右側指向：右上與右下角三角形 */
        .next:hover {
            background-image: 
                linear-gradient(225deg, rgba(0,0,0,0.7) 0%, transparent 23px), /* 右上往左下切 */
                linear-gradient(315deg, rgba(0,0,0,0.7) 0%, transparent 23px); /* 右下往左上切 */
            background-size: 100% 50%;
            background-position: top, bottom;
            background-repeat: no-repeat;
        }

        /* 左側指向：左上與左下角三角形 */
        .prev:hover {
            background-image: 
                linear-gradient(135deg, rgba(0,0,0,0.7) 0%, transparent 23px), /* 左上往右下切 */
                linear-gradient(45deg, rgba(0,0,0,0.7) 0%, transparent 23px);  /* 左下往右上切 */
            background-size: 100% 50%;
            background-position: top, bottom;
            background-repeat: no-repeat;
        }
        

        /* --- 新增：底部細進度條 --- */
        .progress-container {
            position: absolute;
            bottom: 0; /* 貼齊最底部 */
            left: 0;
            width: 100%;
            height: 3px; /* 進度條粗細 */
            background: var(--progress-bg);
            z-index: 25;
        }

        .progress-bar {
            height: 100%;
            width: 0%; /* 初始寬度 */
            background: var(--progress-color);
            transition: width 0.6s ease; /* 讓長度變化也有動畫 */
        }

        .text-area {
    margin-top: 9px;   /* 跟圖片框保持一點距離 */
    padding: 0 10px;    /* 左右留白 */
    min-height: 40px;  /* 固定高度防止文字切換時畫面抖動 */
    overflow: hidden; /* <--- 加入這一行，切掉 line-2 那凸出的 10% */
}
/* 置中樣式 */
.text-area.align-center { text-align: center; }

/* 靠左樣式 */
.text-area.align-left { text-align: left; }

.line-1 {
    font-size: var(--font-size-main);
    color: var(--text-color-main);
    font-weight: 400; /* 粗體 */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;  /* 設定行高 */

}

/* 邏輯：當父層沒有 line-2 時，顯示兩行 */
.line-1.double {
    -webkit-line-clamp: 2; 
}

/* 邏輯：當父層有 line-2 時，只顯示一行 */
.line-1.single {
    -webkit-line-clamp: 1;
}

.line-2 {
    font-size: var(--font-size-sub);
    color: var(--text-color-sub);
    margin-top: 0px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis; /* 超出長度變... */
    position: relative;
    top: -1px; /* 負數代表向上移動，調整這裡可以精確到 1px */
        /* 核心邏輯：創造補償空間 */
    width: 110%;           /* 讓容器比父層寬出一點點 */
    margin-left: -5%;      /* 用負邊距把它拉回正中心 */
    
    /* 增加內部左右緩衝，確保文字主體還是在原位 */
    padding: 0 15px;       
    
    /* 保持原本的置中與省略號設定 */
    text-align: center;
    box-sizing: border-box; /* 確保 padding 不會把容器撐得更寬 */
}
.line-2.is-truncated {
    width: 110%;
    margin-left: -5%;
    padding-left: 18px; /* 這裡放你之前測試出最準的補償值 */
    padding-right: 5px; /* 右邊縮小，讓 ... 凸出去 */
}


/* 自定義提示框本體 */
.custom-tooltip {
    position: absolute;
    background: rgba(0, 0, 0, 0.8); /* 半透明黑 */
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 11px;
    z-index: 200;
    pointer-events: none; /* 防止滑鼠碰到提示框自己導致閃爍 */
    opacity: 0;           /* 預設透明 */
    transition: opacity 0.15s; /* 快速顯示的速度 */
    white-space: nowrap;
    top: 45px;         /* 根據大頭貼位置調整，讓它出現在頭像上方 */
    left: 0px;
}

/* 當啟用顯示時 */
.custom-tooltip.show {
    opacity: 1;
}

/* 編輯框本體 */
.edit-overlay {
    position: absolute;
    bottom: 0;
    left: 80px; /* 留一點邊距 */
    right: 0px;
    top: 125px; /* 這裡要根據你圖片的高度微調，讓它蓋在文字區上 */
    border: 0px solid rgba(66, 66, 66, 0.8); /* 白色半透明邊框 */
    background: rgba(0, 0, 0, 0); /* 稍微帶點暗色背景，不然白色字在淺色圖上看不見 */
    z-index: 300;
    display: none; /* 預設隱藏 */
    flex-direction: column;
    padding: 9px 8px 0px 6px; /* 上、右、下、左 (底部改小) */
    box-sizing: border-box;
    overflow: visible;
    
    border-left: 2px solid rgba(255, 255, 255, 0.3);
    border-bottom: 2px solid rgba(0, 0, 0, 0.5);
    border-right: 2px solid rgba(0, 0, 0, 0.4);
}

/* 文字顯示區 */
.edit-content {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none; /* Firefox */
    text-align: center;
    color: rgb(33, 33, 33);
    outline: none; /* 點擊時不要有藍色框 */
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 1px;
}

.edit-content::-webkit-scrollbar {
    display: none; /* Chrome/Safari */
}

/* 3. 修改 X 按鈕的樣式 */
.close-edit {
    position: absolute; /* 關鍵：絕對定位 */
    bottom: -7px;        /* 距離底部只有 2px */
    left: 50%;          /* 置中 */
    transform: translateX(-50%); 
    cursor: pointer;
    color: rgb(33, 33, 33);
    font-size: 12px;    /* 適中的大小 */
    opacity: 0.8;       /* 平時半透明，不擋視線 */
    padding: 0px;       /* 增加一點點感應範圍，好點擊 */
}
.close-edit:hover { opacity: 1; }
</style>
</head>
<body>

    <div id="carousel-app"></div>

<script>

const allData = rawData.trim().split('\n').map(line => line.trim());
const avatarTitle = allData[0];
const avatarID = allData[1];
const avatarURL = allData[2];
const slideData = [];
for (let i = 3; i < allData.length; i += 4) {
    if (allData[i]) {
        slideData.push({
            line1: allData[i] || "",
            line2: allData[i + 1] || "",
            id: allData[i + 2] || "",
            url: allData[i + 3] || "#"
        });
    }
}

// --- 3. 將 HTML 封裝 ---
const htmlTemplate = `
<div class="main-wrapper">
    <div id="avatarTooltip" class="custom-tooltip"></div>
    <a href="#" target="_blank" class="avatar-link">
        <img src="" class="avatar" alt="Author">
    </a>
    <div class="carousel-container" id="carousel">
        <button class="nav-btn prev" id="btnPrev">&#10094;</button>
        <button class="nav-btn next" id="btnNext">&#10095;</button>
        <div id="carouselTrack" class="carousel-track"></div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
    <div class="text-area" id="textArea">
        <div id="textLine1" class="line-1"></div>
        <div id="textLine2" class="line-2"></div>
    </div>
    <div id="editOverlay" class="edit-overlay">
        <div id="editContent" class="edit-content" contenteditable="true"></div>
        <div id="btnCloseEdit" class="close-edit">x</div>
    </div>
</div>
`;

// --- 4. JS 核心邏輯 ---
const autoPlayDelay = 2000;
let currentIndex = 0;
let timer = null;
let touchStartX = 0;
let isMouseInside = false;
let isEditing = false;

// 重要：全域宣告，不在這裡抓元素
let track, progressBar, container, editContent; 

function init() {
    // A. 注入 HTML
    document.getElementById('carousel-app').innerHTML = htmlTemplate;

    // B. HTML 出現後，才抓取元素（重要修正：不要在這裡加 const）
    track = document.getElementById('carouselTrack');
    progressBar = document.getElementById('progressBar');
    container = document.getElementById('carousel');
    editContent = document.getElementById('editContent');

    // C. 更新大頭貼
    const avatarImg = document.querySelector('.avatar');
    const avatarLink = document.querySelector('.avatar-link');
    const tooltip = document.getElementById('avatarTooltip');

    if (avatarImg) avatarImg.src = `https://lh3.googleusercontent.com/d/${avatarID}`;
    if (avatarLink) avatarLink.href = avatarURL;
    if (tooltip) tooltip.innerText = avatarTitle;

    avatarImg.onmouseenter = () => tooltip.classList.add('show');
    avatarImg.onmouseleave = () => tooltip.classList.remove('show');

    // D. 生成圖片軌道
    slideData.forEach((item) => {
        const linkWrap = document.createElement('a');
        linkWrap.href = item.url || '#';
        linkWrap.target = "_blank";
        linkWrap.className = "slide-link";
        const img = document.createElement('img');
        img.src = `https://lh3.googleusercontent.com/d/${item.id}`;
        img.loading = "lazy";
        linkWrap.appendChild(img);
        track.appendChild(linkWrap);
    });

    // E. 綁定事件監聽（重要修正：將事件綁定移入 init）
    document.getElementById('btnPrev').onclick = (e) => { e.stopPropagation(); moveSlide(-1); };
    document.getElementById('btnNext').onclick = (e) => { e.stopPropagation(); moveSlide(1); };
    document.getElementById('textArea').onclick = () => toggleEdit(true);
    document.getElementById('btnCloseEdit').onclick = (e) => { e.stopPropagation(); toggleEdit(false); };

    // F. 滾輪慢速化
    editContent.addEventListener('wheel', (e) => {
        e.preventDefault();
        editContent.scrollTop += e.deltaY / 15;
    }, { passive: false });

    // G. 滑鼠感應
    container.onmouseenter = () => { isMouseInside = true; stopTimer(); };
    container.onmouseleave = () => { isMouseInside = false; startTimer(); };

    // H. 初始化執行
    updateProgress();
    updateText();
    startTimer();
    setupTouch();
}

// --- 5. 所有的功能函數 ---

function goToSlide(index) {
    currentIndex = index;
    if (currentIndex >= slideData.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = slideData.length - 1;
    const offset = -currentIndex * 100;
    track.style.transform = `translateX(${offset}%)`;
    updateProgress();
    updateText();
}

function updateText() {
    const currentData = slideData[currentIndex];
    const l1 = document.getElementById('textLine1');
    const l2 = document.getElementById('textLine2');
    const textArea = document.getElementById('textArea');

    l1.innerText = currentData.line1;
    l2.innerText = currentData.line2;

    const hasLine2 = currentData.line2 && currentData.line2.trim() !== "";
    if (hasLine2) {
        l1.className = "line-1 single";
        l2.style.display = "block";
        textArea.className = "text-area align-center";
    } else {
        l1.className = "line-1 double";
        l2.style.display = "none";
        textArea.className = (l1.offsetHeight > 25) ? "text-area align-left" : "text-area align-center";
    }

    if (l2.scrollWidth > l2.clientWidth) l2.classList.add('is-truncated');
    else l2.classList.remove('is-truncated');
}

function toggleEdit(show) {
    const overlay = document.getElementById('editOverlay');
    const content = document.getElementById('editContent');
    const textArea = document.getElementById('textArea');
    
    if (show) {
        isEditing = true;
        const l1 = document.getElementById('textLine1').innerText;
        const l2 = document.getElementById('textLine2').innerText;
        content.innerHTML = `${l1}<br>${l2}`;
        overlay.style.display = 'flex';
        textArea.style.opacity = '0';
        stopTimer();
    } else {
        isEditing = false;
        overlay.style.display = 'none';
        textArea.style.opacity = '1';
        startTimer();
    }
}

function updateProgress() {
    if (slideData.length > 1) {
        const percent = (currentIndex / (slideData.length - 1)) * 100;
        progressBar.style.width = percent + '%';
    } else {
        progressBar.style.width = '100%'; 
    }
}

function moveSlide(step) { goToSlide(currentIndex + step); }

function stopTimer() { clearInterval(timer); timer = null; }

function startTimer() {
    if (slideData.length <= 1) return;
    if (isEditing || isMouseInside) return;
    if (timer) stopTimer();
    const now = Date.now();
    let timeUntilNextBeat = autoPlayDelay - (now % autoPlayDelay);
    if (timeUntilNextBeat < autoPlayDelay - 100) {
        timeUntilNextBeat += autoPlayDelay;
        }
    timer = setTimeout(() => {
        goToSlide(currentIndex + 1);
        timer = setInterval(() => { if (!isMouseInside) goToSlide(currentIndex + 1); }, autoPlayDelay);
    }, timeUntilNextBeat);
}

function setupTouch() {
    if (slideData.length <= 1) return;
    container.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        stopTimer();
    }, {passive: true});
    container.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) moveSlide(diff > 0 ? 1 : -1);
        else startTimer();
    }, {passive: true});
}

// 啟動！
init();

</script>

</body>
</html>
