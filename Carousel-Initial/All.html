<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // --- 1. 原始資料保持不變 ---
        const rawData = `
作者名稱
1fjHIQfW5cc94wZzQAt-F6w79rxyC6L6i
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
這是第一張圖的第一行文字
這是副標題
1AuObtJoxF1jamKcPB2iEItdaTpHcxbHy
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
這張圖只有第一行，所以它可以顯示兩排文字喔！這張圖只有第一行，所以它可以顯示兩排文字喔！

...
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
第三張圖的標題
第三張的描述第三張的描述第三張的描述第三張的描述
...
https://www.google.com/url?q=https%3A%2F%2Fwww.nicovideo.jp%2Fuser%2F433897%2Fseries&sa=D&sntz=1&usg=AOvVaw0nwr1vIyppVACOIQ_M_Mo1
`;
    </script>

    <style>
        /* --- 2. CSS 保持不變 --- */
        :root {
            --ratio: 16 / 9; 
            --progress-color: #d4d4d49f;
            --progress-bg: rgba(255, 255, 255, 0);
            --text-color-main: rgb(33, 33, 33);
            --text-color-sub: rgb(33, 33, 33);
            --font-size-main: 12px;
            --font-size-sub: 12px;
        }
        body { margin: 0; font-family: sans-serif; background: transparent; }
        .carousel-container { width: 100%; max-width: 300px; margin: auto; position: relative; overflow: hidden; padding-bottom: 3px; aspect-ratio: var(--ratio); }
        .main-wrapper { position: relative; max-width: 800px; margin: auto; padding-left: 80px; }
        .avatar { position: absolute; top: 0px; left: 0px; width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; z-index: 100; object-fit: cover; }
        .carousel-track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-link { width: 100%; height: 100%; flex-shrink: 0; display: block; }
        .slide-link img { width: 100%; height: 100%; object-fit: cover; }
        .nav-btn { position: absolute; top: 0; bottom: 3px; width: 23px; background: rgba(0, 0, 0, 0); color: rgba(255, 255, 255, 0); border: none; cursor: pointer; font-size: 24px; z-index: 15; display: flex; align-items: center; justify-content: center; outline: none; }
        .prev { left: 0; } .next { right: 0; }
        .next:hover { background-image: linear-gradient(225deg, rgba(0,0,0,0.7) 0%, transparent 23px), linear-gradient(315deg, rgba(0,0,0,0.7) 0%, transparent 23px); background-size: 100% 50%; background-position: top, bottom; background-repeat: no-repeat; }
        .prev:hover { background-image: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, transparent 23px), linear-gradient(45deg, rgba(0,0,0,0.7) 0%, transparent 23px); background-size: 100% 50%; background-position: top, bottom; background-repeat: no-repeat; }
        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--progress-bg); z-index: 25; }
        .progress-bar { height: 100%; width: 0%; background: var(--progress-color); transition: width 0.6s ease; }
        .text-area { margin-top: 9px; padding: 0 10px; min-height: 40px; cursor: pointer; }
        .text-area.align-center { text-align: center; }
        .text-area.align-left { text-align: left; }
        .line-1 { font-size: var(--font-size-main); color: var(--text-color-main); font-weight: 400; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .line-1.double { -webkit-line-clamp: 2; }
        .line-1.single { -webkit-line-clamp: 1; }
        .line-2 { font-size: var(--font-size-sub); color: var(--text-color-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; top: -1px; width: 110%; margin-left: -5%; padding: 0 15px; text-align: center; box-sizing: border-box; }
        .line-2.is-truncated { padding-left: 18px; padding-right: 5px; }
        .custom-tooltip { position: absolute; background: rgba(0, 0, 0, 0.8); color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; z-index: 200; pointer-events: none; opacity: 0; transition: opacity 0.15s; white-space: nowrap; top: 45px; left: 0px; }
        .custom-tooltip.show { opacity: 1; }
        .edit-overlay { position: absolute; bottom: 0; left: 80px; right: 0px; top: 125px; border-left: 2px solid rgba(255, 255, 255, 0.3); border-bottom: 2px solid rgba(0, 0, 0, 0.5); border-right: 2px solid rgba(0, 0, 0, 0.4); background: rgba(0, 0, 0, 0); z-index: 300; display: none; flex-direction: column; padding: 9px 8px 0px 6px; box-sizing: border-box; }
        .edit-content { flex: 1; overflow-y: auto; scrollbar-width: none; text-align: center; color: rgb(33, 33, 33); outline: none; font-size: 12px; line-height: 1.6; }
        .edit-content::-webkit-scrollbar { display: none; }
        .close-edit { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); cursor: pointer; color: rgb(33, 33, 33); font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="carousel-app"></div>

<script>

const allData = rawData.trim().split('\n').map(line => line.trim());
const avatarTitle = allData[0];
const avatarID = allData[1];
const avatarURL = allData[2];
const slideData = [];
for (let i = 3; i < allData.length; i += 4) {
    if (allData[i]) {
        slideData.push({
            line1: allData[i] || "",
            line2: allData[i + 1] || "",
            id: allData[i + 2] || "",
            url: allData[i + 3] || "#"
        });
    }
}

// --- 3. 將 HTML 封裝 ---
const htmlTemplate = `
<div class="main-wrapper">
    <div id="avatarTooltip" class="custom-tooltip"></div>
    <a href="#" target="_blank" class="avatar-link">
        <img src="" class="avatar" alt="Author">
    </a>
    <div class="carousel-container" id="carousel">
        <button class="nav-btn prev" id="btnPrev">&#10094;</button>
        <button class="nav-btn next" id="btnNext">&#10095;</button>
        <div id="carouselTrack" class="carousel-track"></div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
    <div class="text-area" id="textArea">
        <div id="textLine1" class="line-1"></div>
        <div id="textLine2" class="line-2"></div>
    </div>
    <div id="editOverlay" class="edit-overlay">
        <div id="editContent" class="edit-content" contenteditable="true"></div>
        <div id="btnCloseEdit" class="close-edit">x</div>
    </div>
</div>
`;

// --- 4. JS 核心邏輯 ---
const autoPlayDelay = 2000;
let currentIndex = 0;
let timer = null;
let touchStartX = 0;
let isMouseInside = false;
let isEditing = false;

// 重要：全域宣告，不在這裡抓元素
let track, progressBar, container, editContent; 

function init() {
    // A. 注入 HTML
    document.getElementById('carousel-app').innerHTML = htmlTemplate;

    // B. HTML 出現後，才抓取元素（重要修正：不要在這裡加 const）
    track = document.getElementById('carouselTrack');
    progressBar = document.getElementById('progressBar');
    container = document.getElementById('carousel');
    editContent = document.getElementById('editContent');

    // C. 更新大頭貼
    const avatarImg = document.querySelector('.avatar');
    const avatarLink = document.querySelector('.avatar-link');
    const tooltip = document.getElementById('avatarTooltip');

    if (avatarImg) avatarImg.src = `https://lh3.googleusercontent.com/d/${avatarID}`;
    if (avatarLink) avatarLink.href = avatarURL;
    if (tooltip) tooltip.innerText = avatarTitle;

    avatarImg.onmouseenter = () => tooltip.classList.add('show');
    avatarImg.onmouseleave = () => tooltip.classList.remove('show');

    // D. 生成圖片軌道
    slideData.forEach((item) => {
        const linkWrap = document.createElement('a');
        linkWrap.href = item.url || '#';
        linkWrap.target = "_blank";
        linkWrap.className = "slide-link";
        const img = document.createElement('img');
        img.src = `https://lh3.googleusercontent.com/d/${item.id}`;
        img.loading = "lazy";
        linkWrap.appendChild(img);
        track.appendChild(linkWrap);
    });

    // E. 綁定事件監聽（重要修正：將事件綁定移入 init）
    document.getElementById('btnPrev').onclick = (e) => { e.stopPropagation(); moveSlide(-1); };
    document.getElementById('btnNext').onclick = (e) => { e.stopPropagation(); moveSlide(1); };
    document.getElementById('textArea').onclick = () => toggleEdit(true);
    document.getElementById('btnCloseEdit').onclick = (e) => { e.stopPropagation(); toggleEdit(false); };

    // F. 滾輪慢速化
    editContent.addEventListener('wheel', (e) => {
        e.preventDefault();
        editContent.scrollTop += e.deltaY / 15;
    }, { passive: false });

    // G. 滑鼠感應
    container.onmouseenter = () => { isMouseInside = true; stopTimer(); };
    container.onmouseleave = () => { isMouseInside = false; startTimer(); };

    // H. 初始化執行
    updateProgress();
    updateText();
    startTimer();
    setupTouch();
}

// --- 5. 所有的功能函數 ---

function goToSlide(index) {
    currentIndex = index;
    if (currentIndex >= slideData.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = slideData.length - 1;
    const offset = -currentIndex * 100;
    track.style.transform = `translateX(${offset}%)`;
    updateProgress();
    updateText();
}

function updateText() {
    const currentData = slideData[currentIndex];
    const l1 = document.getElementById('textLine1');
    const l2 = document.getElementById('textLine2');
    const textArea = document.getElementById('textArea');

    l1.innerText = currentData.line1;
    l2.innerText = currentData.line2;

    const hasLine2 = currentData.line2 && currentData.line2.trim() !== "";
    if (hasLine2) {
        l1.className = "line-1 single";
        l2.style.display = "block";
        textArea.className = "text-area align-center";
    } else {
        l1.className = "line-1 double";
        l2.style.display = "none";
        textArea.className = (l1.offsetHeight > 25) ? "text-area align-left" : "text-area align-center";
    }

    if (l2.scrollWidth > l2.clientWidth) l2.classList.add('is-truncated');
    else l2.classList.remove('is-truncated');
}

function toggleEdit(show) {
    const overlay = document.getElementById('editOverlay');
    const content = document.getElementById('editContent');
    const textArea = document.getElementById('textArea');
    
    if (show) {
        isEditing = true;
        const l1 = document.getElementById('textLine1').innerText;
        const l2 = document.getElementById('textLine2').innerText;
        content.innerHTML = `${l1}<br>${l2}`;
        overlay.style.display = 'flex';
        textArea.style.opacity = '0';
        stopTimer();
    } else {
        isEditing = false;
        overlay.style.display = 'none';
        textArea.style.opacity = '1';
        startTimer();
    }
}

function updateProgress() {
    if (slideData.length > 1) {
        const percent = (currentIndex / (slideData.length - 1)) * 100;
        progressBar.style.width = percent + '%';
    } else {
        progressBar.style.width = '100%'; 
    }
}

function moveSlide(step) { goToSlide(currentIndex + step); }

function stopTimer() { clearInterval(timer); timer = null; }

function startTimer() {
    if (isEditing || isMouseInside) return;
    if (timer) stopTimer();
    const now = Date.now();
    let timeUntilNextBeat = autoPlayDelay - (now % autoPlayDelay);
    if (timeUntilNextBeat < autoPlayDelay - 100) {
        timeUntilNextBeat += autoPlayDelay;
        }
    timer = setTimeout(() => {
        goToSlide(currentIndex + 1);
        timer = setInterval(() => { if (!isMouseInside) goToSlide(currentIndex + 1); }, autoPlayDelay);
    }, timeUntilNextBeat);
}

function setupTouch() {
    container.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        stopTimer();
    }, {passive: true});
    container.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) moveSlide(diff > 0 ? 1 : -1);
        else startTimer();
    }, {passive: true});
}

// 啟動！
init();
</script>

</body>
</html>
